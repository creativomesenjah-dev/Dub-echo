# Compila "Dub Echo" para macOS en los servidores de GitHub.
# Cada push genera un .dmg descargable desde la pestaña "Actions".
# Al crear un tag que empiece con "v" (por ejemplo v0.1.0) además publica un Release.
name: Compilar para macOS

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Pruebas del motor de eco
        run: |
          clang++ -O2 -std=c++17 -ISource tests/render_test.cpp -o render_test
          mkdir -p renders
          ./render_test renders

      - name: Configurar (universal Intel + Apple Silicon, macOS 10.13 o superior)
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
            -DDUBECHO_TESTS=ON

      - name: Compilar
        run: cmake --build build --config Release -j 4

      - name: Pruebas de la lógica MIDI
        run: ./build/MidiLogicTest_artefacts/Release/MidiLogicTest

      - name: Firmar (ad-hoc) y verificar
        run: |
          APP="build/DubEcho_artefacts/Release/Dub Echo.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose "$APP"
          echo "Arquitecturas:"; lipo -info "$APP/Contents/MacOS/Dub Echo"
          echo "macOS mínimo (Intel):"
          otool -arch x86_64 -l "$APP/Contents/MacOS/Dub Echo" | grep -A4 -E "LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX" | grep -E "minos|version" | head -2

      - name: Armar el .dmg
        run: |
          mkdir -p dmg
          cp -R "build/DubEcho_artefacts/Release/Dub Echo.app" dmg/
          ln -s /Applications dmg/Applications
          cp docs/LEEME.txt dmg/LEEME.txt
          hdiutil create -volname "Dub Echo" -srcfolder dmg -ov -format UDZO DubEcho.dmg

      - name: Subir el .dmg
        uses: actions/upload-artifact@v4
        with:
          name: DubEcho-macOS
          path: DubEcho.dmg

      - name: Publicar Release (sólo en tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" DubEcho.dmg \
            --title "Dub Echo ${GITHUB_REF_NAME}" \
            --notes "Descargá DubEcho.dmg, abrilo y arrastrá Dub Echo a Aplicaciones. La primera vez: clic derecho > Abrir."
